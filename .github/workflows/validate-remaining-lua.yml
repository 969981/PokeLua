name: Verify remaining Gen1 and Dolphin safe optimizations

on:
  push:
    branches: [develop]
    paths:
      - "Gen 1/**"
      - "Gen 3/Dolphin/**"
      - "tests/remaining/**"
      - ".github/workflows/validate-remaining-lua.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-and-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: All-game syntax and remaining-script baseline parity
        run: python tests/remaining/test_remaining.py
      - name: Scope
        run: |
          echo "OFFLINE_ONLY: no ROM, emulator, GC/Dolphin offer or FPS was measured"
